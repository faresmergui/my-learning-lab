# CodeQL : l'analyseur de sécurité de GitHub. Il lit le code (TypeScript, JavaScript
# et les workflows eux-mêmes) à la recherche de failles connues : injection de HTML,
# workflow qui exécute du texte non fiable, etc. Les alertes apparaissent dans
# l'onglet Security → Code scanning. Gratuit pour un dépôt public.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # chaque lundi matin, pour les nouvelles règles
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # pour publier les alertes dans l'onglet Security
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
