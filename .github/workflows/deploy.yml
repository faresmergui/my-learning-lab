# Pipeline du site : vérifie chaque proposition de modification, et met le site
# en ligne sur GitHub Pages à chaque push sur main. Explications : docs/ARCHITECTURE.md.
name: Build et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Par défaut, le jeton GitHub du workflow ne peut que lire le code.
permissions:
  contents: read

# Un seul déploiement à la fois ; une PR mise à jour annule son build précédent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Les actions sont figées sur une empreinte (SHA) : un tag peut être déplacé, pas une empreinte.
      # Dependabot (.github/dependabot.yml) propose les mises à jour.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # npm ci installe exactement les versions de package-lock.json ;
      # --ignore-scripts empêche les paquets d'exécuter du code à l'installation.
      - run: npm ci --ignore-scripts

      # Bloque la pipeline si une dépendance a une faille connue sérieuse.
      - run: npm audit --audit-level=high

      # Vérifie les types (TypeScript) et le format du contenu des pages .astro.
      - run: npm run check

      # Donne l'adresse et le préfixe du site (ex. /my-learning-hub/) à Astro.
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Chaque lien interne du site construit doit mener à une page qui existe.
      - run: npm run check:links
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Seul ce job peut publier : il reçoit juste les droits nécessaires à GitHub Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
