# Site pipeline: checks every proposed change, and publishes the site to
# GitHub Pages on every push to main. Details (in French): docs/ARCHITECTURE.md.
name: Build et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# By default, the workflow's GitHub token can only read the code.
permissions:
  contents: read

# One deployment at a time; an updated PR cancels its previous build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit SHA: a tag can be moved, a SHA cannot.
      # Dependabot (.github/dependabot.yml) proposes the updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # npm ci installs the exact versions from package-lock.json;
      # --ignore-scripts stops packages from running code at install time.
      - run: npm ci --ignore-scripts

      # Fails the pipeline if a dependency has a known high-severity vulnerability.
      - run: npm audit --audit-level=high

      # Type-checks TypeScript and the .astro pages.
      - run: npm run check

      # Gives Astro the site URL and path prefix (e.g. /my-learning-hub/).
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Every internal link in the built site must point to an existing page.
      - run: npm run check:links
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can publish: it gets just the permissions GitHub Pages needs.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
